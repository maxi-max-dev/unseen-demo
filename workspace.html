<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNSEEN · 空间工作台</title>
<link rel="stylesheet" href="app/theme.css">
<style>
  /* ── 首页专属 ── */
  .hero-cta{ margin:18px 0 0; }
  .tpl-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .tpl{ position:relative; border-radius:20px; overflow:hidden; aspect-ratio:3/4;
        display:flex; align-items:flex-end; text-decoration:none;
        box-shadow:var(--shadow); transition:transform .2s cubic-bezier(.2,.7,.3,1); }
  .tpl:hover{ transform:translateY(-2px); }
  .tpl img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .tpl::after{ content:""; position:absolute; inset:0;
               background:linear-gradient(180deg,rgba(60,30,40,0) 42%,rgba(60,30,40,.55) 100%); }
  .tpl b{ position:relative; z-index:1; color:#fff; font-size:14.5px; padding:12px 14px;
          text-shadow:0 1px 8px rgba(0,0,0,.35); }
  .sc-wrap{ position:relative; margin:0 0 14px; }
  .sc-card{ padding:12px; margin:0; }
  /* 移除按钮盖在卡片右上角,是卡片 <a> 的兄弟节点,点它不会跳进场景 */
  .sc-del{ position:absolute; top:11px; right:11px; z-index:2; width:34px; height:34px;
           border-radius:50%; border:1px solid var(--card-line); background:rgba(255,255,255,.86);
           color:var(--ink-2); font:inherit; font-size:13px; line-height:1; cursor:pointer;
           display:grid; place-items:center; box-shadow:0 4px 10px rgba(60,30,40,.14);
           -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .sc-del:hover{ color:#c25a76; border-color:#ffd6e0; }
  .sc-del:active{ transform:scale(.94); }
  .sc-cover{ display:block; width:100%; aspect-ratio:16/9; border-radius:18px;
             overflow:hidden; position:relative; }
  .sc-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .sc-cover .ph{ position:absolute; inset:0; display:grid; place-items:center; font-size:34px;
                 background:var(--grad-soft); }
  .sc-body{ display:flex; flex-direction:column; padding:10px 4px 2px; }
  .sc-body h3{ margin:0 0 3px; font-size:16.5px; font-weight:700;
               white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sc-body .meta{ font-size:12px; color:var(--ink-2); margin-bottom:8px; }
  .sc-body .chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; }
  /* 用复合选择器压过 theme 里 a.u-card 的 display:block(工兵抓出的特异性坑) */
  .u-card.demo-strip{ display:flex; align-items:center; gap:13px; padding:15px 16px; }
  .demo-strip .play{ width:40px; height:40px; border-radius:50%; flex:none; display:grid;
                     place-items:center; color:#fff; font-size:14px; background:var(--grad);
                     box-shadow:0 8px 18px rgba(242,115,155,.35); }
  .demo-strip .tx{ flex:1; min-width:0; }
  .demo-strip .tx b{ display:block; font-size:15px; }
  .demo-strip .tx span{ font-size:12px; color:var(--ink-2); }
  .demo-strip .go{ color:var(--pink); font-weight:700; }
  @media (min-width:900px){
    /* 桌面两列:左上「场景」、左下「演示」、右侧「我的空间」整列,
       这样左半屏不会从半页开始就是一片空白。手机走 DOM 顺序,不受影响 */
    /* 第二行给 1fr:右列(我的空间)再长,多出来的高度也只摊给第二行,
       「演示」照样紧跟在「场景」下面,左列不会被撑出一个大洞 */
    .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 26px; align-items:start;
            grid-template-areas:"a b" "c b"; grid-template-rows:auto 1fr; }
    .col-a{ grid-area:a; } .col-b{ grid-area:b; } .col-c{ grid-area:c; }
    .hero-cta .u-btn{ max-width:520px; margin:0 auto; }
  }
</style>
</head>
<body class="u-body">
<div class="u-bokeh"></div>
<div class="u-page">

  <header class="u-top">
    <div>
      <a class="u-logo" href="portal.html">U N S E E N<i>.</i></a>
      <div class="u-tag">空间工作台 · 让照片回到它当时朝着的方向</div>
    </div>
    <div class="sp"></div>
    <a class="u-bell" href="web/demo.html" title="六幕演示">▶</a>
  </header>

  <div class="hero-cta">
    <a class="u-btn" href="roadshow.html">进入路演现场</a>
  </div>

  <div class="grid2">
  <div class="col-a">
    <div class="u-sec"><h2>适用场景</h2><span class="u-note">同一套系统</span></div>
    <div class="tpl-row" id="tplRow"></div>
  </div>

  <div class="col-b">
    <div class="u-sec"><h2>我的空间</h2><a class="more" data-studio-entry data-studio-new
      href="web/studio-login.html">登录</a></div>
    <div id="sceneList"></div>
  </div>

  <div class="col-c">
    <div class="u-sec"><h2>演示</h2><span class="u-note">给评委和队友看的</span></div>
    <a class="u-card demo-strip" href="web/demo.html">
      <span class="play">▶</span>
      <span class="tx"><b>六幕演示</b><span>三分钟从头走到尾,不用人解说</span></span>
      <span class="go">→</span>
    </a>
    <div style="height:10px"></div>
    <a class="u-card demo-strip" href="web/show.html?s=s4">
      <span class="play" style="background:linear-gradient(95deg,#c9a2ff,#9fb8ff)">✦</span>
      <span class="tx"><b>只读展览</b><span>主办方选择内容,观众只负责观看</span></span>
      <span class="go">→</span>
    </a>
    <div style="height:10px"></div>
    <a class="u-card demo-strip" data-ai-show
       href="web/show.html?s=s900001&amp;back=workspace.html">
      <span class="play" style="background:linear-gradient(105deg,#65518c,#e1778c)">◎</span>
      <span class="tx"><b>AI 全景回顾 · 已上传</b><span>4 个全景场景、8 张照片，完整走一遍展示流程</span></span>
      <span class="go">→</span>
    </a>
  </div>
  </div>

  <footer style="margin-top:34px; font-size:11px; color:var(--ink-3); text-align:center;">
    UNSEEN · AdventureX 2026
  </footer>
</div>

<nav class="u-nav">
  <a class="on" href="workspace.html"><span class="ic">⌂</span>工作台</a>
  <a class="plus" data-studio-entry href="web/studio-login.html"><span class="ic">＋</span>Studio</a>
  <a href="web/demo.html"><span class="ic">▶</span>演示</a>
</nav>

<script src="app/scenes.js"></script>
<script>
(function(){
  "use strict";
  var U = window.UNSEEN;
  var isLocalOrigin = /^(127\.0\.0\.1|localhost|\[::1\])$/.test(location.hostname);

  document.querySelectorAll("[data-studio-entry]").forEach(function(link){
    link.href = isLocalOrigin ? "server/host.html" : "web/studio-login.html";
  });
  document.querySelectorAll("[data-ai-show]").forEach(function(link){
    link.href = "web/show.html?s=s900001" + (isLocalOrigin ? "&mode=local" : "") +
      "&back=workspace.html";
  });
  var studioNew = document.querySelector("[data-studio-new]");
  if (studioNew && isLocalOrigin) studioNew.textContent = "＋ 新建";

  // 所有插值一律过这里再进 innerHTML:空间名字是用户在 create.html 自由输入的,
  // 也可能来自后端返回的 title,不转义就是一个注入口
  var ESC = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
  function esc(v){
    return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){ return ESC[c]; });
  }

  // 这里只说明产品适用范围,不是三套不同模板。建空间统一从 Studio 开始。
  document.getElementById("tplRow").innerHTML = U.TEMPLATES.map(function(t){
    return '<article class="tpl">' +
           '<img src="' + esc(t.cover) + '" alt="">' + '<b>' + esc(t.name) + '</b></article>';
  }).join("");

  // 一次性清理:老版本首页会把本机后端里的每一个空间(含开发测试空间)自动写进 localStorage。
  // 那些记录不是用户建的,形状固定(kind 为 backend,没有 createdAt、没有封面、没有 join 链接),按形状清一次。
  // 只删这台浏览器的列表记录,后端空间本身一个没动
  try {
    if (!localStorage.getItem("unseen.autoimport.purged")) {
      U.localScenes().forEach(function(s){
        if (s && s.kind === "backend" && !s.createdAt && !s.cover && !(s.links && s.links.join)) {
          U.removeLocalScene(s.id);
        }
      });
      localStorage.setItem("unseen.autoimport.purged", "1");
    }
  } catch (e) {}

  var BUILTIN_IDS = {};
  U.BUILTIN.forEach(function(b){ BUILTIN_IDS[b.id] = 1; });

  var backendState = "probing";  // probing / online / offline
  var backendInfo = {};          // 只放这台浏览器已认领的空间的实时信息,不写回 localStorage

  // 我的空间:内置云端场景 + 用户自己在这台浏览器上建的
  function chip(s){
    if (s.kind === "cloud")   return '<span class="u-chip ok">☁ 云端空间</span>';
    if (s.kind === "backend") {
      return backendState === "offline"
        ? '<span class="u-chip">⚙ 本机空间 · 当前离线</span>'
        : '<span class="u-chip ok">⚙ 本机空间</span>';
    }
    return '<span class="u-chip">✎ 草稿 · 等全景</span>';
  }
  // 照片数只写真数:空间里真正可见的是 selectedCount(auto_ok + approved)。
  // 后端没回或没给 selectedCount 就先不显示,不能退回含待审和拒绝的 photoCount,
  // 也不能用 localStorage 里可能已经过期的 stats.photos。
  function photoText(s){
    if (s.kind === "backend") {
      var info = backendInfo[s.id];
      if (!info || typeof info.selectedCount !== "number") return "";
      return info.selectedCount > 0 ? info.selectedCount + " 张照片" : "还没有照片";
    }
    var n = s.stats && s.stats.photos;
    return (typeof n === "number" && n > 0) ? n + " 张照片" : "";
  }
  // 没有日期就别硬编「刚刚创建」,退到空间编号,同名空间也能分得清
  function metaText(s){
    var parts = [s.date, s.place, photoText(s)].filter(Boolean);
    return parts.length ? parts.join(" · ") : "编号 " + String(s.id).slice(-6);
  }
  function card(s){
    var cover = s.cover
      ? '<img src="' + esc(s.cover) + '" alt="" onerror="this.remove()">'
      : '<span class="ph">🌷</span>';
    var del = BUILTIN_IDS[s.id] ? "" :
      '<button type="button" class="sc-del" data-del="' + esc(s.id) +
      '" title="从这台设备移除" aria-label="从这台设备移除">✕</button>';
    var target = s.kind === "local"
      ? ("app/scene.html?s=" + encodeURIComponent(s.id))
      : (!isLocalOrigin && s.kind === "cloud"
        ? "web/studio-login.html"
        : ((s.links && s.links.studio) || ("server/host.html?space=" + encodeURIComponent(s.id))));
    return '<div class="sc-wrap">' +
      '<a class="u-card sc-card" href="' + esc(target) + '">' +
      '<span class="sc-cover">' + cover + '</span>' +
      '<span class="sc-body"><h3>' + esc(s.title) + '</h3>' +
      '<span class="meta">' + esc(metaText(s)) + '</span>' +
      '<span class="chips">' + chip(s) + '</span></span></a>' + del + '</div>';
  }
  var listEl = document.getElementById("sceneList");
  function render(){
    var list = U.allScenes();
    listEl.innerHTML =
      list.length ? list.map(card).join("") :
      '<div class="u-card u-empty"><div class="big">🌸</div>还没有空间,点上面创建一个</div>';
  }
  listEl.addEventListener("click", function(ev){
    var btn = ev.target.closest && ev.target.closest("[data-del]");
    if (!btn) return;
    ev.preventDefault();
    var id = btn.getAttribute("data-del");
    var sc = U.findScene(id);
    if (!window.confirm("把「" + (sc ? sc.title : id) + "」从这台设备的列表里移除?空间本身还在,不会被删掉。")) return;
    U.removeLocalScene(id);
    render();
    U.toast("已从这台设备移除");
  });
  render();

  // 后端探测只做两件事:知道本机后端在不在(离线的卡老实标出来),
  // 以及给这台浏览器已经有记录的空间补上真实照片数。
  // 不再把后端里的其他空间当成「我的」自动导入,那会把开发测试空间灌进首页
  U.probeBackend(function(ok, j){
    backendState = ok ? "online" : "offline";
    if (ok && j && j.spaces) {
      var have = {};
      U.localScenes().forEach(function(s){ have[s.id] = 1; });
      j.spaces.forEach(function(s){ if (s && have[s.id]) backendInfo[s.id] = s; });
    }
    render();
  });
})();
</script>
</body>
</html>
