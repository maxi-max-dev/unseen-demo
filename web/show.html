<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8f5">
  <title>六个展厅 · UNSEEN</title>
  <link rel="stylesheet" href="../app/theme.css">
  <style>
    /* 本页只写版式，不覆盖 theme.css 的设计变量。 */
    .hub {
      padding-bottom: calc(26px + env(safe-area-inset-bottom, 0));
    }

    .mark {
      flex: none;
      width: 26px;
      height: 26px;
      display: block;
    }

    .mark .lens {
      mix-blend-mode: multiply;
    }

    .lede {
      margin: 4px 4px 14px;
      font-size: 13.5px;
      color: var(--ink-2);
    }

    .rooms {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    /* 权重要压过 theme.css 的 a.u-card{display:block}，否则卡片不会变成一行 */
    a.u-card.room {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 10px;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
    }

    .room .no {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--grad-soft);
      color: #c2536f;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
    }

    .room .nm {
      display: block;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
    }

    .room .ds {
      display: block;
      margin-top: 1px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--ink-3);
    }

    .room .go {
      color: var(--ink-3);
      display: block;
    }

    .room:hover .go {
      color: var(--pink);
    }

    .foot {
      margin: 18px 4px 0;
      text-align: center;
    }

    @media (min-width: 900px) {
      .rooms {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      a.u-card.room {
        padding: 14px 16px;
      }

      /* 桌面上主按钮不必拉满一整行 */
      #startBtn {
        max-width: 300px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>
<body class="u-body">
  <div class="u-bokeh" aria-hidden="true"></div>

  <div class="u-page hub">
    <div class="u-bar">
      <a class="u-back" id="backLink" href="../index.html" aria-label="返回">←</a>
      <h1>六个展厅</h1>
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <g class="lens">
          <circle cx="20" cy="14" r="11" fill="#ff9fc0" opacity=".55"></circle>
          <circle cx="13.5" cy="25" r="11" fill="#ff6e9e" opacity=".55"></circle>
          <circle cx="26.5" cy="25" r="11" fill="#ffc26b" opacity=".55"></circle>
        </g>
        <path d="M20 25.6c-3.8-3.3-6-4.9-6-6.9 0-1.6 1.2-2.8 2.8-2.8 1.2 0 2.5.7 3.2 1.8.7-1.1 2-1.8 3.2-1.8 1.6 0 2.8 1.2 2.8 2.8 0 2-2.2 3.6-6 6.9z"
              fill="#fff" opacity=".92"></path>
      </svg>
    </div>

    <p class="lede">同一段记忆，六种进入方式。</p>

    <a class="u-btn" id="startBtn" data-back-link
       href="../viewer/journey.html?back=web%2Fshow.html">从第一个展厅开始</a>

    <nav class="rooms" aria-label="六个展厅">
      <a class="u-card room" data-back-link href="../viewer/journey.html?back=web%2Fshow.html">
        <span class="no">01</span>
        <span>
          <b class="nm">重温那一天</b>
          <span class="ds">按当天的顺序前行，让散落的瞬间重新连成一段旅程。</span>
        </span>
        <svg class="go" viewBox="0 0 12 20" width="8" height="14" aria-hidden="true"><path d="M2 2l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="u-card room" data-back-link href="../viewer/walk.html?demo=1&amp;back=web%2Fshow.html">
        <span class="no">02</span>
        <span>
          <b class="nm">走进全景</b>
          <span class="ds">让深度恢复距离感，像走回真实房间一样靠近照片。</span>
        </span>
        <svg class="go" viewBox="0 0 12 20" width="8" height="14" aria-hidden="true"><path d="M2 2l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="u-card room" data-back-link href="../viewer/album.html?back=web%2Fshow.html">
        <span class="no">03</span>
        <span>
          <b class="nm">相册</b>
          <span class="ds">把空间摊成一本可翻阅的册子，适合慢慢看，也适合一键成片。</span>
        </span>
        <svg class="go" viewBox="0 0 12 20" width="8" height="14" aria-hidden="true"><path d="M2 2l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="u-card room" data-back-link href="../viewer/timeline.html?back=web%2Fshow.html">
        <span class="no">04</span>
        <span>
          <b class="nm">时光轴</b>
          <span class="ds">沿时间拨动现场，让照片像记忆碎片一样重新浮现。</span>
        </span>
        <svg class="go" viewBox="0 0 12 20" width="8" height="14" aria-hidden="true"><path d="M2 2l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="u-card room" data-back-link href="../viewer/machine.html?back=web%2Fshow.html">
        <span class="no">05</span>
        <span>
          <b class="nm">机器记忆</b>
          <span class="ds">换成机器的冷静目光，看它如何识别、定位并保存一次相聚。</span>
        </span>
        <svg class="go" viewBox="0 0 12 20" width="8" height="14" aria-hidden="true"><path d="M2 2l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="u-card room" data-back-link href="../viewer/online.html?back=web%2Fshow.html">
        <span class="no">06</span>
        <span>
          <b class="nm">真实地图</b>
          <span class="ds">回到真实地理坐标，沿婚车路线看见记忆如何穿过一座城。</span>
        </span>
        <svg class="go" viewBox="0 0 12 20" width="8" height="14" aria-hidden="true"><path d="M2 2l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </nav>

    <p class="u-note foot">六个展厅，同一段记忆。</p>
  </div>

  <script>
    (function () {
      "use strict";

      function backTarget(fallback){
        try{
          var b = new URLSearchParams(location.search).get("back");
          if (b && !/^(https?:)?\/\//.test(b)) return "../" + b.replace(/^(\.\.\/)+/,"").replace(/^\//,"");
        }catch(e){}
        return fallback;
      }

      var backLink = document.getElementById("backLink");
      if (backLink) backLink.setAttribute("href", backTarget("../index.html"));

      /* 把"我从哪来"接力给展厅：从展厅退回本页时，本页的返回键仍然指向原点。
         没有 back 参数时，各展厅链接保持 HTML 里写死的 back=web/show.html，无 JS 也正确。 */
      var inherited = "";
      try {
        var raw = new URLSearchParams(location.search).get("back");
        if (raw && !/^(https?:)?\/\//.test(raw)) inherited = raw;
      } catch (e) {}

      if (inherited) {
        var relay = encodeURIComponent("web/show.html?back=" + encodeURIComponent(inherited));
        Array.prototype.forEach.call(document.querySelectorAll("[data-back-link]"), function (a) {
          a.setAttribute("href", a.getAttribute("href").replace(/back=[^&]*/, "back=" + relay));
        });
      }
    })();
  </script>
</body>
</html>
