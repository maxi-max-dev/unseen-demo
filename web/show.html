<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FFF3F1">
  <title>我们的展览 · UNSEEN</title>
  <link rel="stylesheet" href="../app/theme.css">
  <style>
    .show-page{ padding-bottom:calc(54px + env(safe-area-inset-bottom,0)); }
    .show-bar{ position:sticky; top:0; z-index:20; margin:0 -18px; padding:12px 18px 8px;
      background:linear-gradient(180deg,var(--u-glass-strong),var(--u-glass) 76%,transparent);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
    .mode-chip{ margin-left:auto; }
    .hero{ position:relative; overflow:hidden; min-height:330px; margin-top:12px; padding:28px;
      display:flex; flex-direction:column; justify-content:flex-end; }
    .hero-cover{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.48; }
    .hero-shade{ position:absolute; inset:0; background:
      linear-gradient(180deg,transparent 0%,var(--u-glass-soft) 42%,var(--u-glass-strong) 100%),
      radial-gradient(circle at 82% 18%,var(--u-wash-pink),transparent 40%); }
    .hero-copy{ position:relative; z-index:1; max-width:620px; }
    .eyebrow{ margin:0 0 8px; color:var(--u-pink-deep); font-size:11px; font-weight:800;
      letter-spacing:.28em; text-transform:uppercase; }
    .hero h2{ margin:0; font-family:var(--u-sans); font-size:var(--u-fs-h1);
      font-weight:var(--u-fw-h1); line-height:var(--u-lh-h1); letter-spacing:-.01em;
      text-wrap:balance; }
    .couple{ margin:8px 0 0; color:var(--u-ink-2); font-size:15px; }
    .meta{ display:flex; flex-wrap:wrap; gap:8px; margin-top:15px; }
    .hero-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
    .hero-actions .u-btn{ width:auto; min-height:46px; }
    .facts{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; margin-top:12px; }
    .fact{ padding:14px 10px; text-align:center; }
    .fact b{ display:block; font-size:23px; line-height:1.2; font-variant-numeric:var(--u-num); }
    .fact span{ font-size:11px; color:var(--u-ink-2); }
    .flow-card{ margin-top:12px; padding:17px 18px; }
    .flow-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .flow-head b{ font-size:14px; }
    .flow-head span{ color:var(--u-ink-3); font-size:11px; }
    .flow-steps{ list-style:none; display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
      gap:18px; margin:0; padding:0; }
    .flow-step{ position:relative; min-width:0; padding:12px; border:1px solid var(--u-card-line);
      border-radius:var(--u-r-card); background:var(--u-glass); }
    .flow-step:not(:last-child):after{ content:"→"; position:absolute; right:-15px; top:50%;
      width:12px; color:var(--u-ink-3); font-weight:900; text-align:center; transform:translateY(-50%); }
    .flow-step b{ display:block; font-size:13px; }
    .flow-step strong{ display:block; margin-top:2px; color:var(--u-pink-deep); font-size:20px;
      font-variant-numeric:var(--u-num); }
    .flow-step span{ display:block; margin-top:1px; color:var(--u-ink-3); font-size:10px; line-height:1.45; }
    .disclosure{ margin-top:12px; padding:15px 17px; display:flex; align-items:flex-start; gap:11px;
      border-color:var(--u-ai-review-line); background:var(--u-role-owner-bg); }
    .disclosure-mark{ flex:none; width:30px; height:30px; display:grid; place-items:center;
      border-radius:50%; background:var(--u-role-owner-bg); color:var(--u-gold-ink); font-weight:900; }
    .disclosure b{ display:block; margin-bottom:2px; font-size:12px; }
    .disclosure p{ margin:0; color:var(--u-ink-2); font-size:11px; line-height:1.65; }
    .real-compare{ position:relative; overflow:hidden; min-height:210px; margin-top:12px; padding:22px;
      display:flex; align-items:flex-end; color:var(--u-white); background:var(--u-ink); }
    .real-compare img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .real-compare:after{ content:""; position:absolute; inset:0;
      background:linear-gradient(90deg,var(--u-scrim),var(--u-scrim-soft) 58%,transparent); }
    .real-compare-copy{ position:relative; z-index:1; max-width:470px; }
    .real-compare-copy small{ display:block; margin-bottom:5px; color:var(--u-gold); font-weight:800;
      letter-spacing:.16em; }
    .real-compare-copy h3{ margin:0 0 5px; font-size:22px; }
    .real-compare-copy p{ margin:0 0 15px; color:var(--u-on-dark-2); font-size:12px; line-height:1.65; }
    .real-compare-copy .u-btn{ width:auto; min-height:42px; background:var(--u-white); color:var(--u-ink); box-shadow:none; }
    .view-nav{ display:flex; gap:8px; overflow:auto; padding:4px 2px 8px; scrollbar-width:none; }
    .view-nav::-webkit-scrollbar{ display:none; }
    .view-nav a{ flex:none; min-height:44px; display:inline-flex; align-items:center; gap:6px;
      padding:8px 14px; border-radius:var(--u-r-pill); color:var(--u-ink-2); text-decoration:none;
      background:var(--u-glass); border:1px solid var(--u-card-line); font-size:13px; font-weight:700; }
    .section{ scroll-margin-top:82px; margin-top:18px; }
    .section-head{ display:flex; align-items:flex-end; gap:12px; margin:0 2px 10px; }
    .section-head h2{ margin:0; font-size:19px; }
    .section-head p{ margin:0; color:var(--u-ink-3); font-size:12px; }
    .walk-card{ position:relative; overflow:hidden; min-height:270px; padding:24px;
      display:flex; flex-direction:column; justify-content:flex-end;
      background:linear-gradient(145deg,var(--u-ink),var(--u-ink-2)); color:var(--u-white); }
    .space-orbit{ position:absolute; inset:0; opacity:.88; overflow:hidden; }
    .space-orbit:before,.space-orbit:after{ content:""; position:absolute; border:1px solid var(--u-on-dark-line);
      border-radius:50%; transform:rotate(-15deg); }
    .space-orbit:before{ width:320px; height:150px; right:-45px; top:18px; }
    .space-orbit:after{ width:220px; height:96px; right:34px; top:64px; }
    .pin{ position:absolute; width:14px; height:14px; border-radius:50%; background:var(--u-gold);
      box-shadow:var(--u-glow-gold); }
    .pin.p1{ right:16%; top:23%; }.pin.p2{ right:43%; top:44%; }.pin.p3{ right:28%; top:64%; }
    .walk-copy{ position:relative; z-index:1; max-width:520px; }
    .walk-copy h3{ margin:0 0 6px; font-size:25px; }
    .walk-copy p{ margin:0 0 18px; color:var(--u-on-dark-2); font-size:13px; }
    .walk-copy .u-btn{ width:auto; min-height:46px; background:var(--u-white); color:var(--u-ink); box-shadow:none; }
    .node-preview-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-bottom:10px; }
    .node-preview{ min-width:0; overflow:hidden; color:var(--u-ink); text-decoration:none;
      transition:transform .16s ease,box-shadow .16s ease; }
    .node-preview:active{ transform:scale(.985); }
    .node-preview-media{ position:relative; aspect-ratio:16/10; overflow:hidden;
      background:var(--u-grad-ink); }
    .node-preview-media img{ position:absolute; inset:0; z-index:1; width:100%; height:100%;
      object-fit:cover; display:block; }
    .node-preview-fallback{ position:absolute; inset:0; display:grid; place-items:center;
      color:var(--u-on-dark); font-size:34px; }
    .node-preview-shade{ position:absolute; inset:0; z-index:2;
      background:linear-gradient(180deg,transparent 38%,var(--u-scrim)); }
    .node-preview-index{ position:absolute; z-index:3; left:10px; top:10px; min-width:26px;
      height:26px; padding:0 8px; display:grid; place-items:center; border-radius:var(--u-r-pill);
      background:var(--u-glass-strong); color:var(--u-ink-2); font-size:10px; font-weight:850; }
    .node-preview-open{ position:absolute; z-index:3; right:10px; bottom:9px; color:var(--u-white);
      font-size:11px; font-weight:750; }
    .node-preview-copy{ display:flex; justify-content:space-between; align-items:center; gap:8px;
      padding:11px 12px 12px; }
    .node-preview-copy b{ display:block; min-width:0; overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap; font-size:13px; }
    .node-preview-copy span{ flex:none; color:var(--u-ink-3); font-size:10px; white-space:nowrap; }
    .photo-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .photo{ position:relative; overflow:hidden; aspect-ratio:1/1.12; background:var(--u-glass-soft); }
    .photo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .photo-cap{ position:absolute; left:8px; right:8px; bottom:8px; display:flex; justify-content:space-between;
      gap:8px; padding:7px 9px; border-radius:var(--u-r-chip); background:var(--u-scrim); color:var(--u-white);
      backdrop-filter:blur(8px); font-size:11px; }
    .photo-cap span:last-child{ color:var(--u-on-dark-2); white-space:nowrap; }
    .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--u-role-contrib-fg);
      box-shadow:0 0 0 5px var(--u-wash-ok); }
    .photo.live-focus{ animation:liveFocus 3.8s ease both; }
    @keyframes liveFocus{
      0%,100%{ transform:none; box-shadow:var(--u-shadow); }
      12%,72%{ transform:translateY(-4px) scale(1.025);
        box-shadow:var(--u-shadow-lg),0 0 0 4px var(--u-wash-pink); }
    }
    .task-list,.people{ display:grid; gap:9px; }
    .task-row{ padding:15px 16px; display:grid; grid-template-columns:38px minmax(0,1fr) auto;
      align-items:center; gap:11px; }
    .task-icon{ width:38px; height:38px; display:grid; place-items:center; border-radius:14px;
      background:var(--u-grad-soft); font-size:18px; }
    .task-row h3{ margin:0; font-size:14px; }
    .task-row p{ margin:2px 0 0; color:var(--u-ink-2); font-size:12px; }
    .task-state{ font-size:11px; color:var(--u-ink-2); white-space:nowrap; }
    .people{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .person{ padding:14px; display:flex; align-items:center; gap:10px; }
    .avatar{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
      color:var(--u-white); font-size:13px; font-weight:800; background:var(--u-grad); }
    .person b{ display:block; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .person span{ color:var(--u-ink-2); font-size:11px; }
    .empty{ padding:30px 18px; text-align:center; color:var(--u-ink-2); }
    .empty .big{ display:block; margin-bottom:6px; font-size:30px; }
    .load-card{ margin-top:28px; padding:42px 20px; text-align:center; }
    .live-empty{
      min-height:min(62vh,520px);
      margin-top:28px;
      padding:46px 24px;
      display:grid;
      place-items:center;
      text-align:center;
      background:var(--u-glass-strong);
    }
    .live-empty-mark{
      width:62px;
      height:62px;
      margin:0 auto 18px;
      display:grid;
      place-items:center;
      border-radius:50%;
      color:var(--u-pink-deep);
      background:var(--u-grad-soft);
      font-size:27px;
    }
    .live-empty h2{ margin:0; font-size:clamp(25px,5vw,38px); }
    .live-empty p{ margin:10px 0 0; color:var(--u-ink-2); font-size:13px; line-height:1.75; }
    .live-empty small{
      display:block;
      margin-top:18px;
      color:var(--u-ink-3);
      font-size:11px;
      font-variant-numeric:var(--u-num);
    }
    .spinner{ width:28px; height:28px; margin:0 auto 14px; border:3px solid var(--u-line);
      border-top-color:var(--u-pink); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .error-title{ margin:0 0 8px; font-size:20px; }
    .error-copy{ margin:0 0 18px; color:var(--u-ink-2); }
    .show-foot{ margin:28px 0 0; text-align:center; color:var(--u-ink-3); font-size:11px; letter-spacing:.12em; }
    @media(min-width:720px){
      .hero{ min-height:410px; padding:42px; }
      .facts{ max-width:520px; }
      .node-preview-grid{ grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
      .photo-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
      .people{ grid-template-columns:repeat(3,minmax(0,1fr)); }
      .task-list{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media(max-width:420px){
      .flow-card{ padding:15px 13px; }
      .flow-head{ align-items:flex-start; flex-direction:column; }
      .flow-steps{ grid-template-columns:1fr; gap:8px; }
      .flow-step{ padding:11px 13px; }
      .flow-step:not(:last-child):after{ content:"↓"; left:50%; right:auto; top:auto; bottom:-11px;
        transform:translateX(-50%); }
      .flow-step strong{ font-size:19px; }
      .flow-step span{ font-size:10px; }
    }
    @media(prefers-reduced-motion:reduce){ .spinner{ animation:none; } *{ scroll-behavior:auto!important; } }

    /* ============================================================
       换个方式看:药丸导航的当前态,复用 .view-nav 的胶囊底,只加高亮
       ============================================================ */
    .view-nav.mode-switch a.on{ color:var(--u-white); background:var(--u-grad); border-color:transparent; }

    /* ============================================================
       旅程 journey —— 抄 archive/viewer/journey.html 的"到达标题卡"版式:
       深色章节牌(章号+地点+现场时间)+ 竖向连接线 + 该章照片格。单节点就单章。
       ============================================================ */
    .jr-route{ display:flex; flex-direction:column; margin-top:12px; }
    .jr-link{ align-self:center; width:1px; height:22px; margin:2px 0;
      background:linear-gradient(var(--u-line-strong),transparent); }
    .jr-plaque{ display:flex; align-items:center; gap:14px; padding:20px;
      border-radius:var(--u-r-panel) var(--u-r-panel) 0 0; color:var(--u-on-dark);
      background:var(--u-grad-ink); }
    .jr-no{ flex:none; font-size:28px; font-weight:800; color:var(--u-on-dark-2); font-variant-numeric:var(--u-num); }
    .jr-plaque b{ display:block; font-size:19px; }
    .jr-time{ display:block; margin-top:2px; color:var(--u-on-dark-2); font-size:12px; font-variant-numeric:var(--u-num); }
    .jr-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:2px; padding:2px;
      background:var(--u-card-line); border-radius:0 0 var(--u-r-panel) var(--u-r-panel);
      overflow:hidden; box-shadow:var(--u-shadow); }
    .jr-shot{ position:relative; margin:0; aspect-ratio:1/1; overflow:hidden; background:var(--u-glass-soft); }
    .jr-shot img{ width:100%; height:100%; object-fit:cover; display:block; }
    .jr-shot figcaption{ position:absolute; left:5px; right:5px; bottom:5px; padding:3px 7px;
      border-radius:var(--u-r-chip); background:var(--u-scrim); color:var(--u-on-dark); font-size:9.5px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ============================================================
       时光轴 timeline —— 抄 archive/viewer/timeline.html 的拼贴质感,
       横向宝丽来长条 + 底部顺序刻度(不是时钟,只是数组位置)。
       ============================================================ */
    .tl-wrap{ margin-top:12px; padding:17px 0 20px; }
    .tl-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 18px 14px; }
    .tl-head b{ font-size:14px; }
    .tl-head span{ color:var(--u-ink-3); font-size:11px; }
    .tl-strip{ display:flex; gap:14px; overflow:auto; padding:6px 18px 16px; scroll-snap-type:x proximity; }
    .tl-card{ flex:none; width:132px; margin:0; padding:7px 7px 10px; background:var(--u-card);
      border:1px solid var(--u-card-line); border-radius:6px; box-shadow:var(--u-shadow);
      transform:rotate(var(--rot,0deg)); scroll-snap-align:start; }
    .tl-frame{ aspect-ratio:4/3; overflow:hidden; border-radius:2px; background:var(--u-glass-soft); }
    .tl-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
    .tl-card figcaption{ display:flex; justify-content:space-between; gap:6px; margin-top:7px; font-size:10px; color:var(--u-ink-3); }
    .tl-card figcaption b{ color:var(--u-ink-2); font-variant-numeric:var(--u-num); }
    .tl-track{ position:relative; height:14px; margin:0 18px; }
    .tl-track-line{ position:absolute; left:0; right:0; top:50%; height:2px; background:var(--u-line-strong); }
    .tl-tick{ position:absolute; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%;
      background:var(--u-pink); transform:translateX(-50%); }

    /* ============================================================
       画册 album —— 抄 archive/viewer/album.html 的装订边 + band/plate 版式,
       书脊在手机宽度也保留(不是桌面专属),纸面用 theme 的暖白 token。
       ============================================================ */
    .al-book{ display:flex; margin-top:12px; border-radius:var(--u-r-panel); overflow:hidden; box-shadow:var(--u-shadow); }
    .al-spine{ position:relative; flex:none; width:16px; background:var(--u-grad-ink); }
    .al-mark{ position:absolute; left:50%; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--u-gold); }
    .al-pages{ flex:1 1 auto; min-width:0; padding:20px 18px 24px; background:var(--u-bg-2); }
    .al-chapter + .al-chapter{ margin-top:26px; padding-top:22px; border-top:1px solid var(--u-line); }
    .al-head{ margin-bottom:12px; }
    .al-time{ display:block; font-size:11px; letter-spacing:.08em; color:var(--u-pink-deep); font-weight:700; }
    .al-head h3{ margin:4px 0 0; font-size:20px; }
    .al-plates{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .al-plate{ margin:0; padding:6px 6px 0; background:var(--u-card); border:1px solid var(--u-card-line); }
    .al-shot{ aspect-ratio:4/3; overflow:hidden; background:var(--u-glass-soft); }
    .al-shot img{ width:100%; height:100%; object-fit:cover; display:block; }
    .al-plate figcaption{ display:flex; justify-content:space-between; gap:6px; padding:7px 1px 8px; font-size:10.5px; color:var(--u-ink-3); }
    .al-plate figcaption b{ color:var(--u-pink-deep); font-weight:700; }

    /* ============================================================
       监控墙 machine —— 抄 archive/viewer/machine.html 的取景框质感:
       深色底(--u-grad-ink)+ 单色调冷光照片墙 + 呼吸取景框 + HUD 文字条。
       ============================================================ */
    .mc-wall{ margin-top:12px; padding:16px; border-radius:var(--u-r-panel); color:var(--u-on-dark);
      background:var(--u-grad-ink); box-shadow:var(--u-shadow-lg); }
    .mc-hud{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px;
      font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
      font-size:10px; letter-spacing:.1em; color:var(--u-on-dark-2); text-transform:uppercase; }
    .mc-rec{ display:flex; align-items:center; gap:5px; color:var(--u-on-dark); }
    .mc-rec i{ width:7px; height:7px; border-radius:50%; background:var(--u-ai-error); box-shadow:0 0 6px var(--u-ai-error);
      animation:mcBlink 1.2s ease-in-out infinite; }
    @keyframes mcBlink{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }
    .mc-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-auto-rows:80px; gap:3px; }
    .mc-tile{ position:relative; margin:0; overflow:hidden; background:var(--u-ink); }
    .mc-tile.big{ grid-column:span 2; grid-row:span 2; }
    .mc-tile img{ width:100%; height:100%; object-fit:cover; display:block;
      filter:grayscale(.35) brightness(.72) saturate(1.15) hue-rotate(180deg); transition:filter .4s ease; }
    .mc-tile.target img{ filter:none; }
    .mc-frame{ position:absolute; inset:0; opacity:0; }
    .mc-tile.target .mc-frame{ opacity:1; animation:mcBreathe 1.6s ease-in-out infinite; }
    .mc-frame .c{ position:absolute; width:10px; height:10px; border-color:var(--u-on-dark); border-style:solid; border-width:0; }
    .mc-frame .c.tl{ top:3px; left:3px; border-top-width:2px; border-left-width:2px; }
    .mc-frame .c.tr{ top:3px; right:3px; border-top-width:2px; border-right-width:2px; }
    .mc-frame .c.bl{ bottom:3px; left:3px; border-bottom-width:2px; border-left-width:2px; }
    .mc-frame .c.br{ bottom:3px; right:3px; border-bottom-width:2px; border-right-width:2px; }
    @keyframes mcBreathe{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
    .mc-tile figcaption{ position:absolute; left:4px; bottom:3px; right:4px; padding:1px 4px; border-radius:3px;
      background:var(--u-scrim); color:var(--u-on-dark); font-size:8.5px; letter-spacing:.03em;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* 灯箱:五种视图共用,点 [data-photo] 卡片放大看原图 */
    [data-photo]{ cursor:pointer; }
    .lb-mask{ position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center;
      padding:20px; background:var(--u-grad-ink); opacity:0; pointer-events:none; transition:opacity .22s ease; }
    .lb-mask.on{ opacity:.985; pointer-events:auto; }

  <script>
    (function(){

      function publicName(name){
        var n = String(name || "").trim();

        return LOCAL ? ("/spaces/" + encodeURIComponent(SID) + "/" + rel)
          : (BASE + "/spaces/" + encodeURIComponent(SID) + "/" + rel);

      function coverUrl(path){
        if (!path) return "";

      function dirWord(yaw){

      }
      // ============================================================
      // 灯箱:五种视图共用。data-photo=当前视图 photos 下标;渲染时把 photos/cfg 存进 LB。

      // ============================================================
      var LB = { photos:[], cfg:null, idx:-1 };
      function lbRemember(sp,cfg){ LB.photos = sp.photos || []; LB.cfg = cfg; }
      function lbEnsureDom(){

          '<div class="lb-state" id="lbState" role="status" aria-live="polite"></div></div>' +
          '<figcaption class="lb-cap"><span id="lbCapL"></span><i id="lbCapR"></i></figcaption></figure>' +
          '<button class="lb-close" id="lbClose" aria-label="关闭大图">✕</button>' +
          '<button class="lb-nav prev" id="lbPrev" aria-label="上一张">‹</button>' +
          '<button class="lb-nav next" id="lbNext" aria-label="下一张">›</button>';
        document.body.appendChild(mask);
        mask.addEventListener("click",function(e){ if (e.target === mask) lbClose(); });
        document.getElementById("lbClose").addEventListener("click",lbClose);

        document.getElementById("lbNext").addEventListener("click",function(){ lbStep(1); });

      }
      // 加载态用同一个递增 token 认领:prev/next 连点时,上一张图迟到的 onload/onerror
      // 不能盖掉当前这张的占位态/报错文案(否则会出现"明明看的是第2张,提示却是第1张挂了")。
      var lbLoadToken = 0;
      function lbSetState(html){
        var el = document.getElementById("lbState");
        if (!el) return;
        if (html) { el.innerHTML = html; el.classList.add("on"); }
        else { el.classList.remove("on"); el.innerHTML = ""; }
      }
      function lbOpen(i){
        var p = LB.photos[i];
        if (!p) return;
        lbEnsureDom();
        LB.idx = i;
        var img = document.getElementById("lbImg");
        var full = assetUrl(p.src || p.thumb), thumb = assetUrl(p.thumb || p.src);
        var token = ++lbLoadToken;
        img.classList.remove("on");
        lbSetState('<span class="spinner" aria-hidden="true"></span><span>照片加载中…</span>');

          if (token !== lbLoadToken) return;

          if (token !== lbLoadToken) return;
          if (img.src !== thumb) { img.src = thumb; return; }
          lbSetState("这张照片暂时加载不出来,可能是网络不稳定");
        };
        if (img.src !== full) img.src = full;
        else if (img.complete) { if (img.naturalWidth > 0) img.onload(); else img.onerror(); }
        var lbl = photoLabel(p,LB.cfg || {});
        var left = String(p.title || "").trim() || lbl.name || "";
        var right = [String(p.timeLabel || "").trim(),lbl.dir].filter(Boolean).join(" · ");

      function loadSpace(){

      function altViewUrl(id){

          var dir = isFinite(yaw) ? dirWord(yaw) : "";
          var left = String(p.title || "").trim() || name;
          var right = String(p.timeLabel || "").trim() || dir;
          var photoId = String(p.id || p.src || "");
          return '<article class="u-card photo" data-photo="' + i + '"' + (photoId
            ? ' data-photo-id="' + esc(photoId) + '"' : "") + '><img src="' + esc(assetUrl(p.thumb || p.src)) +
            '" alt="展览照片 ' + (i + 1) + '" loading="lazy"><div class="photo-cap"><span>' +
            esc(left) + '</span><span>' + esc(right) + "</span></div></article>";
        }).join("") + "</div>" : empty("▦","当前还没有可展示的已上传照片");
        return '<section class="section" id="photos"><div class="section-head"><h2>已上传</h2>' +
          "<p>已经进入只读展览；待审核内容不会出现在这里</p></div>" + body + "</section>";
      }
      function tasksSection(sp,cfg){
        var tasks = (sp.tasks || []).slice();
        if (cfg.taskVisibility === "completed") {
          tasks = tasks.filter(function(t){
            return t.status === "filled" || (t.filledBy && t.filledBy.length);
          });
        }
        var body = tasks.length ? '<div class="task-list">' + tasks.map(function(t){
          var done = t.status === "filled" || (t.filledBy && t.filledBy.length);
          return '<article class="u-card task-row"><div class="task-icon">' +
            (t.type === "wish" ? "♡" : "◎") + '</div><div><h3>' + esc(t.title || "一段记忆") +
            "</h3><p>" + esc(t.brief || "") + '</p></div><span class="task-state">' +
            (done ? "已经补上" : (t.status === "closed" ? "已经结束" : "仍在寻找")) +
            "</span></article>";
        }).join("") + "</div>" : empty("✓","这里还没有可展示的任务痕迹");
        return '<section class="section" id="tasks"><div class="section-head"><h2>任务痕迹</h2>' +
          "<p>看见哪些方向被大家一起补上</p></div>" + body + "</section>";
      }
      function peopleSection(sp,cfg){
        var list = (sp.contributors || []).slice().sort(function(a,b){
          return (b.photos || 0) - (a.photos || 0);
        });
        var body = list.length ? '<div class="people">' + list.map(function(c,i){
          var name = cfg.contributorVisibility === "anonymous" ? ("宾客 " + String(i+1).padStart(2,"0"))
            : publicName(c.name);
          return '<article class="u-card person"><span class="avatar">' + esc(name.slice(0,1)) +
            '</span><div><b>' + esc(name) + "</b><span>" + (c.photos || 0) +
            " 张照片进入空间</span></div></article>";
        }).join("") + "</div>" : empty("♡","还没有贡献者记录");
        return '<section class="section" id="contributors"><div class="section-head"><h2>一起补全的人</h2>' +
          "<p>感谢每一个留下视角的人</p></div>" + body + "</section>";
      }
      // ============================================================
      // 换个方式看:同一份 sp/cfg,四种版式骨架。抄自 archive/viewer/ 的四个旧皮,
      // 颜色全部换成 theme.css 的 --u- token,不读旧的 window.TOUR 数据脚本,不进 3D(3D 走进保持独立页)。
      // 只渲 sp.photos 里的真实 URL,不拿 assets/walkdemo/ 的演示图冒充宾客照片。
      // ============================================================
      function journeyView(sp,cfg){
        var nodes = sp.nodes || [], photos = sp.photos || [];
        if (!nodes.length) return empty("→","还没有可以走的旅程");
        var chapters = nodes.map(function(n,ci){
          var mine = [];
          photos.forEach(function(p,i){ if (p.nodeId === n.id) mine.push(i); });
          var grid = mine.length ? '<div class="jr-grid">' + mine.map(function(i){
            var p = photos[i], lbl = photoLabel(p,cfg);
            var cap = [lbl.name,lbl.dir].filter(Boolean).join(" · ");
            return '<figure class="jr-shot" data-photo="' + i + '"><img src="' +
              esc(assetUrl(p.thumb || p.src)) + '" alt="" loading="lazy">' +
              (cap ? "<figcaption>" + esc(cap) + "</figcaption>" : "") + "</figure>";
          }).join("") + "</div>" : empty("→","这一章还没有照片进来");
          return '<section class="jr-chapter"><div class="jr-plaque"><span class="jr-no">' +
            String(ci + 1).padStart(2,"0") + "</span><div><b>" + esc(n.name || ("节点 " + (ci + 1))) +
            "</b>" + (n.time ? '<span class="jr-time">' + esc(n.time) + "</span>" : "") +
            "</div></div>" + grid + "</section>";
        });
        return '<div class="jr-route">' + chapters.join('<div class="jr-link" aria-hidden="true"></div>') + "</div>";
      }
      function timelineView(sp,cfg){
        var photos = sp.photos || [];
        if (!photos.length) return empty("▤","还没有可以回顾的时光");
        var rot = [-3,2,-1,2.5,-2,1.5,-2.5,3,-1.5];
        var cards = photos.map(function(p,i){
          var lbl = photoLabel(p,cfg);
          return '<figure class="tl-card" data-photo="' + i + '" style="--rot:' + rot[i % rot.length] +
            'deg"><div class="tl-frame"><img src="' + esc(assetUrl(p.thumb || p.src)) +
            '" alt="" loading="lazy"></div><figcaption><b>' + String(i + 1).padStart(2,"0") +
            "</b><span>" + esc(lbl.name || lbl.dir || "") + "</span></figcaption></figure>";
        }).join("");
        var ticks = photos.map(function(p,i){
          var pct = photos.length > 1 ? (i / (photos.length - 1)) * 100 : 0;
          return '<span class="tl-tick" style="left:' + pct + '%"></span>';
        }).join("");
        return '<div class="u-card tl-wrap"><div class="tl-head"><b>按进入展览的顺序回看</b>' +
          "<span>共 " + photos.length + " 张 · 顺序=数据本身的先后,不是拍摄时间</span></div>" +
          '<div class="tl-strip">' + cards + '</div><div class="tl-track"><span class="tl-track-line"></span>' +
          ticks + "</div></div>";
      }
      function albumView(sp,cfg){
        var nodes = sp.nodes || [], photos = sp.photos || [];
        if (!nodes.length || !photos.length) return empty("▥","这本画册还没有照片");
        var chapters = nodes.map(function(n,ci){
          var mine = [];
          photos.forEach(function(p,i){ if (p.nodeId === n.id) mine.push(i); });
          var plates = mine.length ? '<div class="al-plates">' + mine.map(function(i){
            var p = photos[i], lbl = photoLabel(p,cfg);
            return '<figure class="al-plate" data-photo="' + i + '"><div class="al-shot"><img src="' +
              esc(assetUrl(p.thumb || p.src)) + '" alt="" loading="lazy"></div><figcaption><span>' +
              esc(lbl.name || "一位宾客") + "</span>" + (lbl.dir ? "<b>" + esc(lbl.dir) + "</b>" : "") +
              "</figcaption></figure>";
          }).join("") + "</div>" : empty("▥","这一章还没有照片进来");
          return '<section class="al-chapter"><div class="al-head">' +
            (n.time ? '<span class="al-time">' + esc(n.time) + "</span>" : "") + "<h3>" +
            esc(n.name || ("第 " + (ci + 1) + " 章")) + "</h3></div>" + plates + "</section>";
        });
        var marks = nodes.map(function(n,i){
          var top = nodes.length > 1 ? 8 + (i * (84 / (nodes.length - 1))) : 8;
          return '<span class="al-mark" style="top:' + top + '%"></span>';
        }).join("");
        return '<div class="al-book"><div class="al-spine" aria-hidden="true">' + marks + "</div>" +
          '<div class="al-pages">' + chapters.join("") + "</div></div>";
      }
      function machineView(sp,cfg){
        var photos = sp.photos || [];
        if (!photos.length) return empty("▣","监控墙还没有信号");
        var target = Math.floor(photos.length / 2);
        var tiles = photos.map(function(p,i){
          var lbl = photoLabel(p,cfg);
          var big = photos.length > 4 && i % 5 === 2;
          return '<figure class="mc-tile' + (big ? " big" : "") + (i === target ? " target" : "") +
            '" data-photo="' + i + '"><img src="' + esc(assetUrl(p.thumb || p.src)) + '" alt="" loading="lazy">' +
            '<span class="mc-frame" aria-hidden="true"><i class="c tl"></i><i class="c tr"></i>' +
            '<i class="c bl"></i><i class="c br"></i></span><figcaption>' +
            esc(lbl.name ? lbl.name : ("CAM " + String(i + 1).padStart(2,"0"))) + "</figcaption></figure>";
        }).join("");
        return '<div class="mc-wall"><div class="mc-hud"><span>SPATIAL MEMORY · MACHINE RECALL</span>' +
          '<span class="mc-rec"><i></i>REC</span></div><div class="mc-grid">' + tiles + "</div></div>";
      }
      var ALT_TITLE = { journey:"旅程", timeline:"时光轴", album:"画册", machine:"监控墙" };
      function renderAlt(sp,cfg,topView){
        lbRemember(sp,cfg);
        document.title = (sp.title || "我们的展览") + " · " + ALT_TITLE[topView] + " · UNSEEN";
        var mode = LOCAL ? '<span class="u-chip hot mode-chip">草稿预览</span>'
          : '<span class="u-chip ok mode-chip">只读展览</span>';
        var body = topView === "journey" ? journeyView(sp,cfg)
          : topView === "timeline" ? timelineView(sp,cfg)
          : topView === "album" ? albumView(sp,cfg)
          : machineView(sp,cfg);
        document.getElementById("app").innerHTML = topBar(sp,cfg,mode,topView) + body +
          '<footer class="show-foot">UNSEEN · 把散落的视角放回同一个空间</footer>';
      }
      function renderLiveEmpty(sp){
        var rawCapacity = (sp && sp.capacity) || {};
        var limits = (sp && sp.limits) || {};
        var max = Number(rawCapacity.maxPhotos != null ? rawCapacity.maxPhotos : limits.maxPhotos);
        if (!isFinite(max) || max <= 0) max = 50;
        var remaining = Number(rawCapacity.remaining);
        if (!isFinite(remaining)) remaining = max;
        remaining = Math.max(0,Math.min(max,remaining));
        var title = (sp && sp.title) || "UNSEEN 路演现场";
        document.title = title + " · UNSEEN";
        document.getElementById("app").innerHTML =
          '<div class="show-bar"><div class="u-bar"><a class="u-back" href="' + esc(backTarget()) +
          '" aria-label="返回">←</a><h1>' + esc(title) +
          '</h1><span class="u-chip ok mode-chip"><i class="live-dot"></i>现场同步中</span></div></div>' +
          '<section class="u-card live-empty" aria-live="polite"><div>' +
          '<div class="live-empty-mark" aria-hidden="true">◎</div>' +
          '<h2>等待主办方上传全景</h2>' +
          '<p>正式空间还没有创建。全景发布后，大屏会自动进入现场展示。</p>' +
          '<small>当前无可进入节点 · 剩余 ' + remaining + "/" + max +
          " 个投稿名额</small></div></section>" +
          '<footer class="show-foot">UNSEEN · 现场同步等待中</footer>';
      }
      function render(sp){
        var cfg = configOf(sp);
        lbRemember(sp,cfg);
        var requested = Q.get("view");
        var entry = cfg.views.indexOf(requested) >= 0 ? requested : cfg.entryView;
        var photos = sp.photos || [], nodes = sp.nodes || [], people = sp.contributors || [];
        // 正式路演空间还没有全景时只显示干净的等待态；不能继承封面、旧节点，
        // 也不能生成任何 Viewer 入口。
        if (LIVE && !nodes.length) {
          renderLiveEmpty(sp);
          return;
        }
        var cover = coverUrl(sp.cover);
        var date = sp.date || "", place = sp.place || "";
        var mode = LOCAL ? '<span class="u-chip hot mode-chip">草稿预览</span>'
          : (LIVE
            ? '<span class="u-chip ok mode-chip"><i class="live-dot"></i>现场同步中</span>'
            : '<span class="u-chip ok mode-chip">只读展览</span>');
        var aiDemo = hasAiDisclosure(sp);
        var primary = entry === "walk"
          ? '<a class="u-btn" href="' + esc(walkUrl(cfg)) + '">' +
            (aiDemo ? "观看 AI 全景" : "走进这段记忆") + "</a>"
          : '<a class="u-btn" href="#' + esc(entry) + '">开始观看</a>';
        var realCompareAction = aiDemo
          ? '<a class="u-btn sec" href="' + esc(realDemoUrl()) + '">真实全景稳定版</a>' : "";
        var sections = "";
        cfg.views.forEach(function(v){
          if (v === "walk") sections += walkSection(sp,cfg);
          if (v === "photos") sections += photosSection(sp,cfg);
          if (v === "tasks" && cfg.taskVisibility !== "hidden") sections += tasksSection(sp,cfg);
          if (v === "contributors" && cfg.contributorVisibility !== "hidden") sections += peopleSection(sp,cfg);
        });
        document.title = (sp.title || "我们的展览") + " · UNSEEN";
        document.getElementById("app").innerHTML =
          topBar(sp,cfg,mode,"exhibition") +
          '<section class="u-card hero">' + (cover ? '<img class="hero-cover" src="' + esc(cover) +
          '" alt="展览封面">' : "") + '<div class="hero-shade"></div><div class="hero-copy">' +
          '<p class="eyebrow">U N S E E N · MEMORY EXHIBITION</p><h2>' +
          esc(sp.title || "我们的展览") + '</h2><p class="couple">' + esc(sp.couple || "") +
          '</p><div class="meta">' + (date ? '<span class="u-chip">' + esc(date) + "</span>" : "") +
          (place ? '<span class="u-chip">' + esc(place) + "</span>" : "") +
          '</div><div class="hero-actions">' + primary + realCompareAction + "</div></div></section>" +
          '<div class="facts"><div class="u-card fact"><b>' + nodes.length +
          '</b><span>空间节点</span></div><div class="u-card fact"><b>' + photos.length +
          '</b><span>展出照片</span></div><div class="u-card fact"><b>' + people.length +
          "</b><span>贡献者</span></div></div>" + flowSection(sp) + disclosureSection(sp) +
          stableCompareSection(sp) + sections +
          '<footer class="show-foot">UNSEEN · 把散落的视角放回同一个空间</footer>';
        if (requested && requested !== entry) history.replaceState(null,"",location.pathname +
          "?" + new URLSearchParams(Array.from(Q.entries()).filter(function(x){ return x[0] !== "view"; })).toString());
      }
      function renderError(err){
        document.getElementById("app").innerHTML =
          '<div class="u-bar"><a class="u-back" href="' + esc(backTarget()) +
          '" aria-label="返回">←</a><h1>展览没有打开</h1></div>' +
          '<div class="u-card load-card u-ai-card" data-ai-state="error">' +
          '<div class="u-ai-head" style="justify-content:center"><span class="u-ai-orb"></span>UNSEEN AI · 读取失败</div>' +
          '<span style="font-size:34px">🥀</span><h2 class="error-title">暂时看不到这场展览</h2>' +
          '<p class="error-copy">' + esc(err && err.message ? err.message : "读取失败") +
          '</p><button class="u-btn sm" onclick="location.reload()">再试一次</button></div>';
      }

      var liveTimer = null;
      var liveBusy = false;
      var liveStamp = "";
      var livePhotoIds = {};

      function photoKey(photo){
        return String((photo && (photo.id || photo.src)) || "");
      }
      function stampOf(sp){
        return String((sp && sp.publishedAt) || "");
      }
      function rememberLiveSnapshot(sp){
        liveStamp = stampOf(sp);
        livePhotoIds = {};
        (sp.photos || []).forEach(function(photo){
          var key = photoKey(photo);
          if (key) livePhotoIds[key] = true;
        });
      }
      function latestPhoto(list){
        var photos = (list || []).slice();
        if (!photos.length) return null;
        return photos.sort(function(a,b){
          return (Number(a.uploadedAt) || 0) - (Number(b.uploadedAt) || 0);
        })[photos.length - 1];
      }
      function focusPhotoCard(photoId,smooth){
        if (!photoId) return;
        var cards = document.querySelectorAll("[data-photo-id]");
        var target = null;
        for (var i = 0; i < cards.length; i++) {
          if (cards[i].getAttribute("data-photo-id") === String(photoId)) {
            target = cards[i]; break;
          }
        }
        if (!target) return;
        target.classList.remove("live-focus");
        void target.offsetWidth;
        target.classList.add("live-focus");
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        target.scrollIntoView({ block:"center", behavior:(smooth && !reduce) ? "smooth" : "auto" });
        setTimeout(function(){ target.classList.remove("live-focus"); },3900);
      }
      function showLiveFeedback(){
        var toast = document.getElementById("liveToast");
        if (!toast) return;
        toast.textContent = "新记忆已回到空间";
        toast.classList.add("show");
        clearTimeout(showLiveFeedback.timer);
        showLiveFeedback.timer = setTimeout(function(){ toast.classList.remove("show"); },3600);
      }
      function scheduleLive(){
        clearTimeout(liveTimer);
        liveTimer = setTimeout(pollLive,5000);
      }
      function pollLive(){
        if (!LIVE || LOCAL) return;
        if (liveBusy) { scheduleLive(); return; }
        liveBusy = true;
        var oldY = window.scrollY;
        loadSpace().then(function(next){
          var nextStamp = stampOf(next);
          if (!nextStamp || nextStamp === liveStamp) return;
          var nextNumber = Number(nextStamp), liveNumber = Number(liveStamp);
          // publishedAt 是公开快照版本。若边缘节点短暂回出更旧的一份，不允许大屏倒退。
          if (isFinite(nextNumber) && isFinite(liveNumber) && nextNumber < liveNumber) return;
          var fresh = (next.photos || []).filter(function(photo){
            var key = photoKey(photo);
            return key && !livePhotoIds[key];
          });
          render(next);
          // 只有 render 成功后才推进版本；异常快照下一轮还能重试，不能被提前记账吞掉。
          rememberLiveSnapshot(next);
          if (fresh.length) {
            var newest = latestPhoto(fresh);
            showLiveFeedback();
            requestAnimationFrame(function(){
              focusPhotoCard(photoKey(newest),true);
            });
          } else {
            window.scrollTo(0,oldY);
          }
        }).catch(function(){
          // 现场网络抖动时保留上一帧，不用错误页覆盖大屏；下一轮继续检查。
        }).then(function(){
          liveBusy = false;
          scheduleLive();
        },function(){
          liveBusy = false;
          scheduleLive();
        });
      }
      function startLive(sp){
        rememberLiveSnapshot(sp);
        var latest = latestPhoto(sp.photos || []);
        if (latest) {
          setTimeout(function(){ focusPhotoCard(photoKey(latest),false); },500);
        }
        scheduleLive();
      }

      // LIVE(大屏)模式点击行为保持原样:这块委托加进来之前,大屏上点照片卡本来就没反应,
      // 灯箱是给宾客翻看展览用的,大屏是无人值守的现场屏幕。真开出一个要手动关闭的全屏遮罩,
      // 会挡住 pollLive() 每 5 秒轮询到新照片时的 liveFocus 高亮反馈,没人会去点右上角 X 关掉它。
      // 所以 LIVE 分支直接短路,不开灯箱,行为和加灯箱之前完全一样。
      document.getElementById("app").addEventListener("click",function(e){
        if (LIVE) return;
        var card = e.target.closest ? e.target.closest("[data-photo]") : null;
        if (!card) return;
        var i = parseInt(card.getAttribute("data-photo"),10);
        if (isFinite(i)) lbOpen(i);
      });

      loadSpace().then(function(sp){
        if (!LIVE && ALT_VIEWS.indexOf(TOP_VIEW) >= 0) {
          renderAlt(sp,configOf(sp),TOP_VIEW);
          return;
        }
        render(sp);
        if (LIVE && !LOCAL) startLive(sp);
      }).catch(renderError);
    })();
  </script>
</body>
</html>
